<!DOCTYPE html>
<html>
<head>
    <title>Photography Portfolio</title>
</head>
<body>
    <h1>My Photography Portfolio</h1>
    <div id="photos"></div>

    <script>
        async function loadPhotos() {
            const res = await fetch("http://localhost:8100/photos");
            const data = await res.json();
            const container = document.getElementById("photos");
            container.innerHTML = data.map(
                p => `<div><h3>${p.title}</h3><p>${p.file_path}</p></div>`
            ).join("");
        }
        loadPhotos();
    </script>
</body>
</html>
