services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: photos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio

  api:
    build: ./api
    ports:
      - "8100:8000"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: photos
      POSTGRES_HOST: postgres
      NAS_PHOTOS_PATH: /nas/photos
    volumes:
      - ./api:/app
      - /mnt/nas/portfolio:/nas/photos:ro  # Update this path to your actual NAS mount
    depends_on:
      - postgres
    networks:
      - portfolio

networks:
  portfolio:
    driver: bridge

volumes:
  postgres_data:
