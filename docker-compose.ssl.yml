
services:
  web:
    build: 
      context: ./api
    command: /bin/sh -c "ln -sf /mnt/nas/images /app/media/images 2>/dev/null || true; gunicorn portfolio.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /mnt/nas/images:/mnt/nas/images
    environment:
      - DJANGO_SETTINGS_MODULE=portfolio.settings
    env_file:
      - .env.production
    depends_on:
      - db
      - redis

  nginx:
    build: 
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /mnt/nas/images:/mnt/nas/images
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certbot/www:/var/www/certbot
      - ./frontend/nginx/nginx-ssl.conf:/etc/nginx/conf.d/nginx.conf
    depends_on:
      - web
    command: "/bin/sh -c 'ln -sf /mnt/nas/images /app/media/images 2>/dev/null || true; while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    volumes:
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.production

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data:
